[project]
name = "nearsurf"
version = "0.1.0"
description = "Near-surface models (7 onshore scenarios, water layer and seafloor) and background noise for 2D synthetic seismic data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zzzzswh" }]
requires-python = ">=3.10"
keywords = ["seismic", "near-surface", "synthetic data", "weathering layer", "topography", "noise", "first-break picking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/zzzzswh/nearsurf"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]      # land.plot and examples/make_figures.py

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nearsurf"]
